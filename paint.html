<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Paint · The Vision</title>
  <meta name="description" content="Draw glowing strokes over your live webcam using hand gestures">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #020204;
      font-family: 'Inter', system-ui, sans-serif;
    }

    video {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      z-index: 0;
    }

    #paint {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      display: block;
      z-index: 1;
    }

    /* ── Back link ── */
    .nav-back {
      position: fixed; top: 24px; left: 28px; z-index: 20;
      display: flex; align-items: center; gap: 8px;
      text-decoration: none;
      color: rgba(255,255,255,0.45);
      font-size: 13px; font-weight: 500; letter-spacing: 0.2px;
      padding: 8px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 100px;
      backdrop-filter: blur(10px);
      transition: color 0.2s, background 0.2s;
    }
    .nav-back:hover {
      color: rgba(255,255,255,0.75);
      background: rgba(255,255,255,0.09);
    }
    .nav-back svg { width: 14px; height: 14px; }

    /* ── Mode indicator (top-right) ── */
    .mode-badge {
      position: fixed; top: 24px; right: 28px; z-index: 20;
      padding: 8px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 100px;
      backdrop-filter: blur(10px);
      color: rgba(255,255,255,0.5);
      font-size: 12px; font-weight: 500;
      pointer-events: none;
      transition: color 0.3s, border-color 0.3s;
    }
    .mode-badge.drawing { color: #00ffcc; border-color: rgba(0,255,204,0.25); }
    .mode-badge.grabbing { color: #ff9f43; border-color: rgba(255,159,67,0.25); }
    .mode-badge.erasing { color: #ff6b6b; border-color: rgba(255,107,107,0.25); }

    /* ── Toolbar ── */
    .toolbar {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      z-index: 20;
      display: flex; align-items: center; gap: 6px;
      padding: 8px 14px;
      background: rgba(10,10,20,0.7);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 100px;
      backdrop-filter: blur(16px);
    }

    /* Color swatches */
    .swatch {
      width: 24px; height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
      flex-shrink: 0;
    }
    .swatch:hover { transform: scale(1.15); }
    .swatch.active { border-color: rgba(255,255,255,0.8); transform: scale(1.2); }

    .divider {
      width: 1px; height: 20px;
      background: rgba(255,255,255,0.1);
      margin: 0 6px;
      flex-shrink: 0;
    }

    /* Brush size buttons */
    .size-btn {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.15s, background 0.15s;
    }
    .size-btn:hover { background: rgba(255,255,255,0.08); }
    .size-btn.active { border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.1); }
    .size-btn .dot {
      border-radius: 50%;
      background: rgba(255,255,255,0.7);
    }

    /* Action buttons */
    .action-btn {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.15s, background 0.15s;
      color: rgba(255,255,255,0.5);
    }
    .action-btn:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.8); }
    .action-btn.active { border-color: rgba(255,107,107,0.5); background: rgba(255,107,107,0.12); color: #ff6b6b; }
    .action-btn svg { width: 14px; height: 14px; }

    /* ── Gesture hints ── */
    .gesture-hint {
      position: fixed; top: 70px; right: 28px; z-index: 20;
      display: flex; flex-direction: column; gap: 4px;
      font-size: 11px;
      color: rgba(255,255,255,0.25);
      text-align: right;
      pointer-events: none;
      transition: opacity 0.5s;
    }
    .gesture-hint span { white-space: nowrap; }

    /* ── Status pill ── */
    .status {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      padding: 7px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 100px;
      color: rgba(255,255,255,0.35);
      font-size: 11px;
      backdrop-filter: blur(10px);
      pointer-events: none;
      transition: opacity 0.5s;
      white-space: nowrap;
      z-index: 20;
    }
  </style>
</head>

<body>
  <video id="cam" autoplay playsinline></video>
  <canvas id="paint"></canvas>

  <!-- Back -->
  <a class="nav-back" href="index.html">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 3L5 8l5 5" />
    </svg>
    Back to Game
  </a>

  <!-- Mode badge -->
  <div class="mode-badge" id="mode-badge">Draw</div>

  <!-- Gesture hints -->
  <div class="gesture-hint" id="gesture-hints">
    <span>pinch → draw</span>
    <span>pinch near stroke → grab & move</span>
    <span>both hands pinch → undo</span>
  </div>

  <!-- Toolbar -->
  <div class="toolbar" id="toolbar">
    <!-- Colors injected by JS -->
  </div>

  <!-- Status -->
  <div class="status" id="status">Waiting for camera…</div>

  <script>
  (() => {
    // ── Config ──
    const COLORS = [
      '#00ffcc', '#ff00ff', '#aaff00', '#ff9f43',
      '#a855f7', '#ffffff', '#ff6b9d', '#ffd700',
    ];
    const SIZES = [2, 5, 10];
    const SIZE_LABELS = ['S', 'M', 'L'];
    const PINCH_THRESHOLD = 0.055;
    const GRAB_RADIUS = 40;       // px: how close pinch must be to a stroke to grab it

    // ── DOM ──
    const canvas  = document.getElementById('paint');
    const ctx     = canvas.getContext('2d');
    const videoEl = document.getElementById('cam');
    const status  = document.getElementById('status');
    const toolbar = document.getElementById('toolbar');
    const badge   = document.getElementById('mode-badge');
    const hints   = document.getElementById('gesture-hints');

    // ── State ──
    let strokes       = [];      // completed strokes
    let activeStroke   = null;    // currently being drawn
    let grabbedStroke  = null;    // currently being moved
    let grabOffset     = { x: 0, y: 0 };
    let grabStart      = { x: 0, y: 0 };

    let currentColor = COLORS[0];
    let currentSize  = SIZES[1];
    let eraserMode   = false;

    let wasPinchingL = false;
    let wasPinchingR = false;

    // ── Build toolbar ──
    function buildToolbar() {
      let html = '';

      // Color swatches
      COLORS.forEach((c, i) => {
        html += `<div class="swatch${i === 0 ? ' active' : ''}" data-color="${c}"
                      style="background:${c};" title="${c}"></div>`;
      });

      html += '<div class="divider"></div>';

      // Brush sizes
      SIZES.forEach((s, i) => {
        const dotSize = 4 + i * 3;
        html += `<button class="size-btn${i === 1 ? ' active' : ''}" data-size="${s}" title="${SIZE_LABELS[i]}">
                   <span class="dot" style="width:${dotSize}px;height:${dotSize}px;"></span>
                 </button>`;
      });

      html += '<div class="divider"></div>';

      // Eraser
      html += `<button class="action-btn" id="eraser-btn" title="Eraser">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 20H7L3 16c-.8-.8-.8-2 0-2.8L14.6 1.6c.8-.8 2-.8 2.8 0l5 5c.8.8.8 2 0 2.8L11 20"/>
          <path d="M18 13l-1.5-1.5"/>
        </svg>
      </button>`;

      // Undo
      html += `<button class="action-btn" id="undo-btn" title="Undo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10h13a4 4 0 0 1 0 8H9"/>
          <polyline points="7 14 3 10 7 6"/>
        </svg>
      </button>`;

      // Clear
      html += `<button class="action-btn" id="clear-btn" title="Clear All">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
        </svg>
      </button>`;

      // Save
      html += `<button class="action-btn" id="save-btn" title="Save as PNG">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </button>`;

      toolbar.innerHTML = html;

      // Swatch click
      toolbar.querySelectorAll('.swatch').forEach(el => {
        el.addEventListener('click', () => {
          toolbar.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
          el.classList.add('active');
          currentColor = el.dataset.color;
          eraserMode = false;
          document.getElementById('eraser-btn').classList.remove('active');
        });
      });

      // Size click
      toolbar.querySelectorAll('.size-btn').forEach(el => {
        el.addEventListener('click', () => {
          toolbar.querySelectorAll('.size-btn').forEach(s => s.classList.remove('active'));
          el.classList.add('active');
          currentSize = parseInt(el.dataset.size);
        });
      });

      // Eraser
      document.getElementById('eraser-btn').addEventListener('click', () => {
        eraserMode = !eraserMode;
        document.getElementById('eraser-btn').classList.toggle('active', eraserMode);
      });

      // Undo
      document.getElementById('undo-btn').addEventListener('click', () => {
        strokes.pop();
      });

      // Clear
      document.getElementById('clear-btn').addEventListener('click', () => {
        strokes = [];
        activeStroke = null;
        grabbedStroke = null;
      });

      // Save
      document.getElementById('save-btn').addEventListener('click', saveImage);
    }
    buildToolbar();

    // ── Resize ──
    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // ── Save composite image ──
    function saveImage() {
      const offscreen = document.createElement('canvas');
      offscreen.width  = canvas.width;
      offscreen.height = canvas.height;
      const oCtx = offscreen.getContext('2d');

      // Draw video frame (mirrored to match what user sees)
      oCtx.save();
      oCtx.translate(offscreen.width, 0);
      oCtx.scale(-1, 1);
      oCtx.drawImage(videoEl, 0, 0, offscreen.width, offscreen.height);
      oCtx.restore();

      // Draw strokes on top
      renderStrokes(oCtx, offscreen.width, offscreen.height);

      const link = document.createElement('a');
      link.download = `camera-paint-${Date.now()}.png`;
      link.href = offscreen.toDataURL('image/png');
      link.click();
    }

    // ── Stroke geometry helpers ──
    function strokeBBox(s) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const p of s.points) {
        const px = p.x + s.offsetX;
        const py = p.y + s.offsetY;
        if (px < minX) minX = px;
        if (py < minY) minY = py;
        if (px > maxX) maxX = px;
        if (py > maxY) maxY = py;
      }
      return { minX, minY, maxX, maxY,
               cx: (minX + maxX) / 2,
               cy: (minY + maxY) / 2 };
    }

    function distToStroke(px, py, s) {
      let minD = Infinity;
      for (const p of s.points) {
        const dx = px - (p.x + s.offsetX);
        const dy = py - (p.y + s.offsetY);
        const d  = Math.sqrt(dx * dx + dy * dy);
        if (d < minD) minD = d;
      }
      return minD;
    }

    function findNearestStroke(px, py) {
      let best = null, bestDist = GRAB_RADIUS;
      for (let i = strokes.length - 1; i >= 0; i--) {
        const d = distToStroke(px, py, strokes[i]);
        if (d < bestDist) {
          bestDist = d;
          best = strokes[i];
        }
      }
      return best;
    }

    // ── Render strokes ──
    function renderStrokes(drawCtx, w, h) {
      const allStrokes = activeStroke ? [...strokes, activeStroke] : strokes;

      for (const s of allStrokes) {
        if (s.points.length < 2) continue;

        drawCtx.save();
        drawCtx.globalCompositeOperation = 'lighter';
        drawCtx.lineCap = 'round';
        drawCtx.lineJoin = 'round';

        // Outer glow
        drawCtx.shadowColor = s.color;
        drawCtx.shadowBlur = s.width * 4 + 8;
        drawCtx.strokeStyle = s.color;
        drawCtx.lineWidth = s.width;
        drawCtx.globalAlpha = 0.5;
        drawPath(drawCtx, s);
        drawCtx.stroke();

        // Core stroke
        drawCtx.shadowBlur = s.width * 2;
        drawCtx.globalAlpha = 0.9;
        drawPath(drawCtx, s);
        drawCtx.stroke();

        // Bright center
        drawCtx.shadowBlur = 0;
        drawCtx.globalAlpha = 1;
        drawCtx.strokeStyle = brighten(s.color);
        drawCtx.lineWidth = Math.max(1, s.width * 0.4);
        drawPath(drawCtx, s);
        drawCtx.stroke();

        drawCtx.restore();
      }

      // Highlight grabbed stroke
      if (grabbedStroke) {
        const bbox = strokeBBox(grabbedStroke);
        drawCtx.save();
        drawCtx.strokeStyle = 'rgba(255,159,67,0.35)';
        drawCtx.lineWidth = 1;
        drawCtx.setLineDash([4, 4]);
        drawCtx.strokeRect(
          bbox.minX - 8, bbox.minY - 8,
          bbox.maxX - bbox.minX + 16,
          bbox.maxY - bbox.minY + 16
        );
        drawCtx.restore();
      }
    }

    function drawPath(drawCtx, s) {
      drawCtx.beginPath();
      const pts = s.points;
      const ox = s.offsetX;
      const oy = s.offsetY;
      drawCtx.moveTo(pts[0].x + ox, pts[0].y + oy);

      if (pts.length === 2) {
        drawCtx.lineTo(pts[1].x + ox, pts[1].y + oy);
      } else {
        for (let i = 1; i < pts.length - 1; i++) {
          const cx = (pts[i].x + pts[i + 1].x) / 2 + ox;
          const cy = (pts[i].y + pts[i + 1].y) / 2 + oy;
          drawCtx.quadraticCurveTo(pts[i].x + ox, pts[i].y + oy, cx, cy);
        }
        const last = pts[pts.length - 1];
        drawCtx.lineTo(last.x + ox, last.y + oy);
      }
    }

    function brighten(hex) {
      // Quick brighten: blend toward white
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      const f = 0.5;
      const nr = Math.round(r + (255 - r) * f);
      const ng = Math.round(g + (255 - g) * f);
      const nb = Math.round(b + (255 - b) * f);
      return `rgb(${nr},${ng},${nb})`;
    }

    // ── Render loop ──
    function loop() {
      const w = canvas.width;
      const h = canvas.height;

      ctx.clearRect(0, 0, w, h);

      // Draw mirrored video as background
      ctx.save();
      ctx.translate(w, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(videoEl, 0, 0, w, h);
      ctx.restore();

      // Draw strokes
      renderStrokes(ctx, w, h);

      // Draw cursor dots
      drawCursors(ctx);

      requestAnimationFrame(loop);
    }

    // ── Cursor rendering ──
    let cursorL = null, cursorR = null;

    function drawCursors(drawCtx) {
      for (const cur of [cursorL, cursorR]) {
        if (!cur) continue;
        drawCtx.save();
        drawCtx.globalCompositeOperation = 'lighter';

        if (cur.pinching) {
          // Bright pinch dot
          const g = drawCtx.createRadialGradient(cur.x, cur.y, 0, cur.x, cur.y, 8);
          g.addColorStop(0, eraserMode ? 'rgba(255,107,107,0.95)' : 'rgba(255,255,255,0.95)');
          g.addColorStop(0.4, eraserMode ? 'rgba(255,107,107,0.5)' : currentColor.replace(')', ',0.5)').replace('rgb(', 'rgba('));
          g.addColorStop(1, 'transparent');
          drawCtx.beginPath();
          drawCtx.arc(cur.x, cur.y, 8, 0, Math.PI * 2);
          drawCtx.fillStyle = g;
          drawCtx.fill();
        } else {
          // Index + thumb dots
          for (const p of [cur.indexPos, cur.thumbPos]) {
            if (!p) continue;
            const g = drawCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 5);
            g.addColorStop(0, 'rgba(255,255,255,0.7)');
            g.addColorStop(0.5, 'rgba(180,210,255,0.3)');
            g.addColorStop(1, 'transparent');
            drawCtx.beginPath();
            drawCtx.arc(p.x, p.y, 5, 0, Math.PI * 2);
            drawCtx.fillStyle = g;
            drawCtx.fill();
          }
        }
        drawCtx.restore();
      }
    }

    // ── MediaPipe Hands ──
    /* global Hands, Camera */
    const hands = new Hands({
      locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`,
    });
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.5,
    });

    hands.onResults(onHandResults);

    const cam = new Camera(videoEl, {
      onFrame: async () => { await hands.send({ image: videoEl }); },
      width: 1280,
      height: 720,
    });

    status.textContent = 'Loading hand tracking…';
    cam.start().then(() => {
      status.textContent = 'Show your hands…';
      setTimeout(() => { status.style.opacity = '0'; }, 3000);
      requestAnimationFrame(loop);
    }).catch(err => {
      console.error('Camera error:', err);
      status.textContent = 'Camera access denied';
    });

    // ── Process hand results ──
    function onHandResults(results) {
      cursorL = null;
      cursorR = null;

      let leftPinching  = false;
      let rightPinching = false;
      let leftPos  = null;
      let rightPos = null;

      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
        // Release everything
        if (activeStroke) { strokes.push(activeStroke); activeStroke = null; }
        grabbedStroke = null;
        wasPinchingL = false;
        wasPinchingR = false;
        updateBadge('draw');
        return;
      }

      for (let i = 0; i < results.multiHandLandmarks.length; i++) {
        const lm = results.multiHandLandmarks[i];
        const label = results.multiHandedness[i].label === 'Right' ? 'left' : 'right';

        const indexTip = lm[8];
        const thumbTip = lm[4];

        const ix = (1 - indexTip.x) * canvas.width;
        const iy = indexTip.y * canvas.height;
        const tx = (1 - thumbTip.x) * canvas.width;
        const ty = thumbTip.y * canvas.height;

        const mx = (ix + tx) / 2;
        const my = (iy + ty) / 2;

        const pdx = thumbTip.x - indexTip.x;
        const pdy = thumbTip.y - indexTip.y;
        const pinchDist = Math.sqrt(pdx * pdx + pdy * pdy);
        const pinching = pinchDist < PINCH_THRESHOLD;

        const cursorData = {
          x: mx, y: my,
          indexPos: { x: ix, y: iy },
          thumbPos: { x: tx, y: ty },
          pinching,
        };

        if (label === 'left') {
          cursorL = cursorData;
          leftPinching = pinching;
          leftPos = { x: mx, y: my };
        } else {
          cursorR = cursorData;
          rightPinching = pinching;
          rightPos = { x: mx, y: my };
        }
      }

      // ─── Two-hand simultaneous pinch = UNDO ───
      const bothPinching = leftPinching && rightPinching;
      const justBothPinched = bothPinching && (!wasPinchingL || !wasPinchingR);
      if (justBothPinched) {
        strokes.pop();
        if (activeStroke) { activeStroke = null; }
        grabbedStroke = null;
        wasPinchingL = leftPinching;
        wasPinchingR = rightPinching;
        return;
      }

      // ─── Single-hand logic (use the first active pinching hand) ───
      const activePinching = rightPinching || leftPinching;
      const activePos = rightPinching ? rightPos : leftPos;
      const wasPinching = rightPinching ? wasPinchingR : wasPinchingL;
      const justPinched = activePinching && !wasPinching;
      const justReleased = !activePinching && (wasPinchingR || wasPinchingL);

      if (justPinched && activePos) {
        if (eraserMode) {
          // Eraser: remove nearest stroke
          const near = findNearestStroke(activePos.x, activePos.y);
          if (near) {
            strokes = strokes.filter(s => s !== near);
          }
          updateBadge('erasing');
        } else {
          // Check if near an existing stroke → grab it
          const near = findNearestStroke(activePos.x, activePos.y);
          if (near) {
            grabbedStroke = near;
            grabStart = { x: activePos.x, y: activePos.y };
            grabOffset = { x: near.offsetX, y: near.offsetY };
            updateBadge('grabbing');
          } else {
            // Start new stroke
            activeStroke = {
              points: [{ x: activePos.x, y: activePos.y }],
              color: currentColor,
              width: currentSize,
              offsetX: 0,
              offsetY: 0,
            };
            updateBadge('drawing');
          }
        }
      } else if (activePinching && activePos) {
        if (grabbedStroke) {
          // Move grabbed stroke
          grabbedStroke.offsetX = grabOffset.x + (activePos.x - grabStart.x);
          grabbedStroke.offsetY = grabOffset.y + (activePos.y - grabStart.y);
        } else if (activeStroke) {
          // Continue drawing — add point if moved enough
          const lastPt = activeStroke.points[activeStroke.points.length - 1];
          const dx = activePos.x - lastPt.x;
          const dy = activePos.y - lastPt.y;
          if (dx * dx + dy * dy > 4) {
            activeStroke.points.push({ x: activePos.x, y: activePos.y });
          }
        }
      } else if (justReleased) {
        // Finalize
        if (activeStroke) {
          if (activeStroke.points.length >= 2) {
            strokes.push(activeStroke);
          }
          activeStroke = null;
        }
        grabbedStroke = null;
        updateBadge('draw');
      }

      wasPinchingL = leftPinching;
      wasPinchingR = rightPinching;
    }

    // ── Badge updates ──
    function updateBadge(mode) {
      badge.className = 'mode-badge';
      if (mode === 'drawing') {
        badge.textContent = '✦ Drawing';
        badge.classList.add('drawing');
      } else if (mode === 'grabbing') {
        badge.textContent = '✥ Moving';
        badge.classList.add('grabbing');
      } else if (mode === 'erasing') {
        badge.textContent = '✕ Erasing';
        badge.classList.add('erasing');
      } else {
        badge.textContent = 'Draw';
      }
    }
  })();
  </script>
</body>
